name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Server did not become healthy in time"
              cat server.log
              exit 1
            fi
            sleep 1
          done

          status=0
          for route in / /ops /deck /privacy; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${route}")
            echo "GET ${route} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::Route ${route} returned ${code}"
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            cat server.log
          fi
          exit "$status"
